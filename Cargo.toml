[workspace]
resolver = "2"
members = ["crates/tsm-core", "crates/tsm-cli", "src-tauri"]

[workspace.package]
version = "2.0.3"
edition = "2021"
license = "MIT"


[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Keep the build cache small: line numbers only for our crates (panics still
# show file:line), no debug info for third-party libraries.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
