<style>
/* Layout: sticky table of contents on the left, one section per app page; each screenshot carries numbered pins that match the list beside it. All text lives in the script below in Thai and English; the TH / EN switch re-renders the page. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

:root[data-theme="dark"] {

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.75; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 32px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 40px; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; line-height: 1.3; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.1rem; margin-top: 18px; }
p { margin: 8px 0; }
a { color: var(--accent); }
kbd, .k { font-family: var(--font-body); font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; overflow-wrap: anywhere; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
code { font-family: Consolas, "Cascadia Mono", monospace; font-size: .92em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }

nav.toc { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; font-size: .93rem; }
nav.toc .label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
nav.toc a { display: block; padding: 5px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { background: var(--accent-soft); color: var(--accent); outline: none; }
nav.toc .grp { margin-top: 14px; }

/* language switch */
.lang { display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.lang button { font: 600 .88rem var(--font-body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 32px; }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { min-width: 0; }
header.hero { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
header.hero p { color: var(--muted); max-width: 70ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { font-size: .82rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; color: var(--muted); }

section.pg { padding-top: 40px; scroll-margin-top: 12px; }
section.pg > p.lead { color: var(--muted); max-width: 72ch; }
.where { font-size: .9rem; color: var(--muted); }
.where b { color: var(--fg); }

.shot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
.shot ol.legend { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.frame img { cursor: zoom-in; }
.zoomer { position: fixed; inset: 0; z-index: 50; background: rgba(6, 8, 18, .88); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.zoomer .frame { width: min(96vw, calc((100vh - 70px) * 1.6)); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.zoomer .frame img { cursor: zoom-out; }
.zoomer .pin { width: 32px; height: 32px; line-height: 32px; font-size: 15px; }
.zoomer .hint { color: #e8eaf4; font-size: .9rem; margin-top: 10px; text-align: center; }
figure { margin: 0; min-width: 0; }
.frame { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0d1020; box-shadow: 0 10px 30px -18px rgba(20, 20, 60, .5); }
.frame img { display: block; width: 100%; height: auto; }
figcaption { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.pin { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 13px/26px var(--font-body); text-align: center; box-shadow: 0 0 0 3px var(--pin-ring), 0 3px 10px rgba(0,0,0,.4); cursor: pointer; border: 0; padding: 0; transition: transform .15s; }
.pin.on, .pin:hover, .pin:focus-visible { transform: translate(-50%, -50%) scale(1.25); outline: none; }

ol.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: n; }
ol.legend li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: default; }
ol.legend li.on { border-color: var(--accent); background: var(--accent-soft); }
ol.legend li .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; text-align: center; line-height: 26px; }
ol.legend li b { display: block; }
ol.legend li span.d { color: var(--muted); font-size: .92rem; }

.howto { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
.howto h3 { margin: 0 0 6px; }
.howto ol { margin: 0; padding-left: 1.4em; }
.howto ol li { margin: 3px 0; }
.note { margin-top: 12px; border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.note.tip { background: var(--tip-soft); }
.note.warn { background: var(--warn-soft); }
.note b:first-child { margin-right: 4px; }

.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.quick .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.quick .card b { font-family: var(--font-head); font-weight: 500; font-size: 1.05rem; display: block; margin-bottom: 4px; }
.quick .card ol { margin: 0; padding-left: 1.2em; font-size: .94rem; }

.faq details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
.faq summary { cursor: pointer; font-weight: 600; }
.faq details[open] summary { margin-bottom: 6px; }

@media (max-width: 980px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav.toc { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: 4px; }
  nav.toc .label, nav.toc .grp, nav.toc .lang-row { width: 100%; margin-top: 4px; }
  .shot { grid-template-columns: minmax(0, 1fr); }

@media (max-width: 480px) { h1 { font-size: 1.6rem; } .pin { width: 20px; height: 20px; line-height: 20px; font-size: 11px; } }
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>

// ---- language choice: ?lang=en, then the last choice, then the browser language ----
const LANGS = ["th", "en"];
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("tsm-guide-lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("th") ? "th" : "en";
}
let lang = initialLang();
const t = (pair) => (Array.isArray(pair) ? pair[lang === "en" ? 1 : 0] : pair);

function render() {
  const en = lang === "en";
  document.documentElement.lang = lang;
  document.title = t(UI.docTitle);

  const sw = `<div class="lang-row"><div class="lang" role="group" aria-label="${t(UI.langLabel)}">`
    + `<button type="button" data-lang="th" aria-pressed="${!en}">ไทย</button>`
    + `<button type="button" data-lang="en" aria-pressed="${en}">English</button></div></div>`;
  let toc = sw + `<div class="label">${t(UI.toc)}</div><a href="#start">${t(UI.start)}</a>`;
  let lastGroup = "";
  let html = "";
  for (const p of PAGES) {
    const g = t(p.group);
    if (g !== lastGroup) { toc += `<div class="grp label">${g}</div>`; lastGroup = g; }
    toc += `<a href="#${p.id}">${t(p.title)}</a>`;
    const at = (q) => (en && q[6]) ? q[6] : [q[0], q[1]];
    const name = (q) => en ? q[4] : q[2];
    const desc = (q) => en ? q[5] : q[3];
    const pins = p.pins.map((q, i) => { const [x, y] = at(q); return `<button class="pin" type="button" style="--x:${x}%;--y:${y}%" data-i="${i}" aria-label="${i + 1}: ${name(q)}">${i + 1}</button>`; }).join("");
    const legend = p.pins.map((q, i) => `<li data-i="${i}"><span class="n">${i + 1}</span><span><b>${name(q)}</b><span class="d">${desc(q)}</span></span></li>`).join("");
    let how = "";
    if (p.howto) {
      how = `<div class="howto"><h3>${t(p.howto.t)}</h3><ol>${p.howto.s.map((s) => `<li>${t(s)}</li>`).join("")}</ol>`
        + (p.howto.warn ? `<div class="note warn"><b>${t(UI.warn)}</b>${t(p.howto.warn)}</div>` : "")
        + (p.howto.tip ? `<div class="note tip"><b>${t(UI.tip)}</b>${t(p.howto.tip)}</div>` : "") + `</div>`;
    }
    const src = en ? `img/en/${p.img}.jpg` : `img/${p.img}.jpg`;
    html += `<section class="pg" id="${p.id}">
      <h2>${t(p.title)}</h2>
      <div class="where">${t(UI.goTo)}: <b>${t(p.menu)}</b></div>
      <p class="lead">${t(p.lead)}</p>
      <div class="shot">
        <figure><div class="frame"><img src="${src}" alt="${t(UI.shotAlt)} ${t(p.title)}" width="800" height="500" loading="lazy">${pins}</div>
        <figcaption>${t(UI.caption)}</figcaption></figure>
        <ol class="legend">${legend}</ol>
      </div>${how}
    </section>`;
  }
  toc += `<div class="grp label">${t(UI.other)}</div><a href="#faq">${t(UI.faq)}</a>`;

  const tocEl = document.getElementById("toc");
  tocEl.setAttribute("aria-label", t(UI.toc));
  tocEl.innerHTML = toc;
  document.getElementById("hero").innerHTML = `<h1>${t(UI.docTitle)}</h1><p>${t(UI.heroText)}</p>`
    + `<div class="meta"><span class="chip">${t(UI.version)}</span><span class="chip">${t(UI.demo)}</span></div>`;
  document.getElementById("start").innerHTML = `<h2>${t(UI.start)}</h2><p class="lead">${t(UI.startLead)}</p><div class="quick">`
    + QUICK.map((c) => `<div class="card"><b>${t(c.t)}</b><ol>${c.s.map((s) => `<li>${t(s)}</li>`).join("")}</ol></div>`).join("") + `</div>`;
  document.getElementById("pages").innerHTML = html;
  document.getElementById("faq").innerHTML = `<h2>${t(UI.faq)}</h2>`
    + FAQ.map((f) => { const [q, a] = t(f); return `<details><summary>${q}</summary><p>${a}</p></details>`; }).join("");

  tocEl.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  bind();
}

function setLang(next) {
  if (next === lang) return;
  // keep the reader at the same section after switching
  const secs = [...document.querySelectorAll("main section.pg")];
  const here = secs.filter((s) => s.getBoundingClientRect().top <= 80).pop();
  lang = next;
  try { localStorage.setItem("tsm-guide-lang", lang); } catch (e) {}
  render();
  if (here) document.getElementById(here.id)?.scrollIntoView();
  document.querySelector(`.lang button[data-lang="${lang}"]`)?.focus();
}

function bind() {
  // click a screenshot: show it as large as the screen allows (pins included)
  document.querySelectorAll(".frame img").forEach((img) => {
    img.addEventListener("click", () => {
      const sec = img.closest("section.pg");
      const ov = document.createElement("div");
      ov.className = "zoomer";
      ov.setAttribute("role", "dialog");
      ov.setAttribute("aria-label", t(UI.zoom));
      const box = document.createElement("div");
      const frame = img.closest(".frame").cloneNode(true);
      frame.querySelectorAll(".pin").forEach((pin) => {
        const li = sec.querySelector(`ol.legend li[data-i="${pin.dataset.i}"] b`);
        pin.title = li ? li.textContent : "";
      });
      box.appendChild(frame);
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = t(UI.zoomHint);
      box.appendChild(hint);
      ov.appendChild(box);
      const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
      const onKey = (e) => { if (e.key === "Escape") close(); };
      ov.addEventListener("click", close);
      document.addEventListener("keydown", onKey);
      document.body.appendChild(ov);
    });
  });

  // link pins and legend items
  document.querySelectorAll("section.pg").forEach((sec) => {
    const set = (i, on) => sec.querySelectorAll(`[data-i="${i}"]`).forEach((el) => el.classList.toggle("on", on));
    sec.querySelectorAll(".pin, ol.legend li").forEach((el) => {
      const i = el.dataset.i;
      el.addEventListener("mouseenter", () => set(i, true));
      el.addEventListener("mouseleave", () => set(i, false));
      el.addEventListener("focus", () => set(i, true));
      el.addEventListener("blur", () => set(i, false));
      if (el.classList.contains("pin")) el.addEventListener("click", () => {
        const li = sec.querySelector(`ol.legend li[data-i="${i}"]`);
        sec.querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
        set(i, true);
        li?.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      });
    });
  });
}

render();
</script>
